name: Build and Release Resource Pack

on:
  push:
    tags:
      - 'e*w*-v*'  # Triggers on tags like e2w1-v0.1.0, e3w4-v1.0.0, etc.

permissions:
  contents: write

jobs:
  build:
    name: Package Resource Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create resource pack zip
        run: |
          # Extract pack name and version from tag (e2w1-v0.1.0 -> e2w1, 0.1.0)
          PACK_NAME=$(echo $GITHUB_REF_NAME | sed 's/-v.*//')
          VERSION=$(echo $GITHUB_REF_NAME | sed 's/.*-v//')
          FILENAME="${PACK_NAME}-${VERSION}.zip"
          
          # Create zip with pack folder contents
          cd $PACK_NAME
          zip -r "../$FILENAME" assets/ pack.mcmeta pack.png info.json
          cd ..
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: "*.zip"

  release:
    name: Release Resource Pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper changelog generation

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: resource-pack
          path: ./

      - name: Set version variables
        id: set_version
        run: |
          # Extract pack name and version from tag (e2w1-v0.1.0 -> e2w1, 0.1.0)
          PACK_NAME=$(echo $GITHUB_REF_NAME | sed 's/-v.*//')
          VERSION_WITHOUT_V=$(echo $GITHUB_REF_NAME | sed 's/.*-v//')
          
          # Extract modrinth_id and title from the pack's info.json
          MODRINTH_ID=$(grep -o '"modrinth_id": "[^"]*"' $PACK_NAME/info.json | cut -d'"' -f4)
          PACK_TITLE=$(grep -o '"name": "[^"]*"' $PACK_NAME/info.json | cut -d'"' -f4)
          
          echo "version_without_v=$VERSION_WITHOUT_V" >> $GITHUB_OUTPUT
          echo "pack_name=$PACK_NAME" >> $GITHUB_OUTPUT
          echo "modrinth_id=$MODRINTH_ID" >> $GITHUB_OUTPUT
          echo "pack_title=$PACK_TITLE" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          # Get all tags and sort them
          git tag --sort=-version:refname > tags.txt
          
          # Get the current tag
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Current tag: $CURRENT_TAG"
          
          # Find the previous tag (skip the current one)
          PREVIOUS_TAG=""
          while IFS= read -r tag; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              PREVIOUS_TAG="$tag"
              break
            fi
          done < tags.txt
          
          echo "Previous tag: $PREVIOUS_TAG"
          
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog between $PREVIOUS_TAG and $CURRENT_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..$CURRENT_TAG)
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$CURRENT_TAG"
          else
            echo "No previous tag found, using recent commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/$CURRENT_TAG"
          fi
          
          # Create changelog content
          {
            echo "changelog<<EOF"
            echo "## Changes in $CURRENT_TAG"
            echo ""
            echo "**Full Changelog**: [$PREVIOUS_TAG...$CURRENT_TAG]($COMPARE_URL)"
            echo ""
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.set_version.outputs.pack_title }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ steps.set_version.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ steps.set_version.outputs.pack_title }}
          version: ${{ steps.set_version.outputs.version_without_v }}
          files: "*.zip"
          changelog: ${{ steps.changelog.outputs.changelog }}
          loaders: minecraft
          game-versions: |
            >=1.21.6 <=1.21.8
          game-version-filter: releases
          version-type: release
          dependencies: |
            vistas@>=2.11.2(required){modrinth:itzZXRxq}
